<!doctype html>
<!--
  ============================================================================
  ROBOFEST '26 — ROOT HTML SHELL
  File: index.html
  Technology: HTML5 (Semantic Structure & Document Head Configuration)
  Description:
    The entry point HTML document hosting the single-page application.
    Configures typography, dark theme root class, mobile viewports,
    Google Fonts preconnect directives, and client-side script mounting.
  ============================================================================
-->
<html lang="en" class="dark scroll-smooth">
  <head>
    <!-- Standard UTF-8 character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive viewport scaling for modern mobile and desktop screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Title & Description -->
    <title>ROBOFEST '26 — ROBOTiX Club NIT Raipur</title>
    <meta name="description" content="Robofest 2026: Autonomous systems observatory, kinetic trials, and robotics exhibition presented by ROBOTiX Club at National Institute of Technology Raipur." />

    <!-- Custom Dark Obsidian SVG Favicon (Inlined Data URI to eliminate network round-trip) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23010101'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23e879f9' stroke-width='4'/><circle cx='50' cy='50' r='8' fill='%23fae8ff'/></svg>"
    />

    <!-- Preconnect to Google Fonts CDN for zero-latency font delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Web Typography:
      1. Cormorant Garamond (Serif): Monumental editorial headlines & event titles.
      2. IBM Plex Mono (Monospace): High-precision telemetry readouts, badges, & navigation.
      3. Inter (Sans-Serif): Crisp, legible neutral body copy.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <!--
    Body Element:
    - bg-[#010101]: Absolute pitch void black background
    - text-[#e0e0e0]: Porcelain neutral typography
    - selection: High-contrast Ghost Purple highlighting
    - overflow-x-hidden: Prevents horizontal scrolling across wide 3D viewports
  -->
  <body class="bg-[#010101] text-[#e0e0e0] font-sans antialiased selection:bg-[#7e22ce]/30 selection:text-[#fae8ff] overflow-x-hidden">
    <!-- Single-Page Application Mount Target for React Root -->
    <div id="root"></div>

    <!-- Vite ES Module Entry Point (TypeScript + React 19) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
